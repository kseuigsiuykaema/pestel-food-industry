<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光翼獣ソレアロン × 陽砕獣テラノクス — 夜の東京</title>
<style>
  @font-face { font-family: "Shippori Mincho B1"; font-weight: 800; src: url(fonts/mincho.woff2) format("woff2"); }
  @font-face { font-family: "Cinzel"; font-weight: 600; src: url(fonts/cinzel.woff2) format("woff2"); }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 20px "Shippori Mincho B1", serif; letter-spacing: .2em; color: #e8d8bc; }
  #ui { display: none; position: fixed; left: 16px; right: 16px; bottom: 14px; gap: 12px; align-items: center; opacity: .25; transition: opacity .3s; }
  #ui:hover { opacity: 1; }
  #ui button { background: #0008; color: #fff; border: 1px solid #fff4; border-radius: 6px; width: 40px; height: 32px; cursor: pointer; }
  #ui input { flex: 1; accent-color: #ffb050; }
  #time { font: 12px ui-monospace, monospace; min-width: 90px; text-align: right; }
</style>
<script>
  // local three.js for offline rendering; CDN when hosted
  (function () {
    var local = /render|local/.test(location.search) || location.hostname === 'localhost';
    var base = local ? './node_modules/three/' : 'https://cdn.jsdelivr.net/npm/three@0.186.1/';
    var im = document.createElement('script'); im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
    document.currentScript.after(im);
  })();
  window.onerror = function (m, s, l) { window.failed = m + ' @' + s + ':' + l; };
  window.addEventListener('unhandledrejection', function (e) { window.failed = String(e.reason && e.reason.stack || e.reason); });
</script>
</head>
<body>
<div id="stage"></div>
<div id="status">読み込み中…</div>
<div id="ui"><button id="play">❚❚</button><input id="seek" type="range" min="0" step="0.01" value="0"><span id="time"></span></div>
<script type="module">
  import { boot } from './js/main.js';
  boot().catch(function (e) { window.failed = String(e && e.stack || e); document.getElementById('status').textContent = 'Error: ' + e; console.error(e); });
</script>
</body>
</html>
